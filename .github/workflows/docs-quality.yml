name: Docs Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  markdown-formatting:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"

  markdown-links:
    name: Markdown local links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check local markdown links
        run: python3 scripts/check_markdown_links.py

  skill-regression:
    name: Skill regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run skill regression checks
        run: python3 scripts/check_skill_regressions.py
